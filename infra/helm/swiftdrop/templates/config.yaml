# Shared, non-secret settings for the Spring services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: swiftdrop-config
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  WEB_APP_URL: {{ .Values.webAppUrl | quote }}
  # The browser origin is http://localhost or a role address such as http://merchant.localhost
  CORS_ALLOWED_ORIGINS: {{ printf "%s,http://*.localhost" .Values.webAppUrl | quote }}
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://postgres:5432/%s" .Values.config.POSTGRES_DB | quote }}
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_DATA_REDIS_HOST: redis
  SPRING_MAIL_HOST: mailpit
  SPRING_MAIL_PORT: "1025"
  MINIO_ENDPOINT: http://minio:9000
  GATEWAY_URL: http://gateway:8080
  AUTH_SERVICE_URL: http://auth-service:8081
  PARCEL_SERVICE_URL: http://parcel-service:8082
  DISPATCH_SERVICE_URL: http://dispatch-service:8083
  MERCHANT_SERVICE_URL: http://merchant-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085
  REALTIME_SERVICE_URL: http://realtime-service:8086
  REPORTING_SERVICE_URL: http://reporting-service:8087
  AI_ASSISTANT_SERVICE_URL: http://ai-assistant-service:8088
---
# Runs once on an empty PostgreSQL volume: one login and one schema per service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  20-swiftdrop-schemas.sh: |-
{{ .Files.Get "files/20-swiftdrop-schemas.sh" | indent 4 }}
---
# Built from infra/compose/.env, so Kubernetes uses the same keys and passwords as Compose.
{{- $env := dict }}
{{- range splitList "\n" (required "pass the env file: --set-file dotenv=infra/compose/.env" .Values.dotenv) }}
{{- $line := trim . }}
{{- if and $line (not (hasPrefix "#" $line)) (contains "=" $line) }}
{{- $kv := splitn "=" 2 $line }}
{{- $_ := set $env (trim $kv._0) $kv._1 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
type: Opaque
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
