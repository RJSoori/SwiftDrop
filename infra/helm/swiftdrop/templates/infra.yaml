# Database, broker, cache, object storage and mail catcher. Same images as Compose.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgis/postgis:16-3.5
          ports: [{ containerPort: 5432 }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: swiftdrop-config, key: POSTGRES_DB } }
            {{- range list "POSTGRES_USER" "POSTGRES_PASSWORD" "AUTH_DB_PASSWORD" "PARCEL_DB_PASSWORD" "DISPATCH_DB_PASSWORD" "MERCHANT_DB_PASSWORD" "NOTIFICATION_DB_PASSWORD" "REALTIME_DB_PASSWORD" "REPORTING_DB_PASSWORD" "AI_DB_PASSWORD" }}
            {{- include "swiftdrop.secretEnv" (list $ . .) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # one file only: the PostGIS image keeps its own init script (CREATE EXTENSION postgis) in this folder
            - { name: init, mountPath: /docker-entrypoint-initdb.d/20-swiftdrop-schemas.sh, subPath: 20-swiftdrop-schemas.sh }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.storage.postgres }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            {{- include "swiftdrop.secretEnv" (list $ "RABBITMQ_DEFAULT_USER" "RABBITMQ_USER") | nindent 12 }}
            {{- include "swiftdrop.secretEnv" (list $ "RABBITMQ_DEFAULT_PASS" "RABBITMQ_PASSWORD") | nindent 12 }}
          # port check, not rabbitmq-diagnostics: run as root before the broker starts, that command creates
          # the Erlang cookie file as root and the broker then crashes once because it cannot read it
          readinessProbe:
            tcpSocket: { port: 5672 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      enableServiceLinks: false
      securityContext: { fsGroup: 1001 } # the Bitnami image runs as user 1001
      containers:
        - name: minio
          image: bitnamilegacy/minio:2025.7.23-debian-12-r5
          ports: [{ containerPort: 9000 }]
          env:
            {{- include "swiftdrop.secretEnv" (list $ "MINIO_ROOT_USER" "MINIO_ROOT_USER") | nindent 12 }}
            {{- include "swiftdrop.secretEnv" (list $ "MINIO_ROOT_PASSWORD" "MINIO_ROOT_PASSWORD") | nindent 12 }}
            - name: MINIO_DEFAULT_BUCKETS
              valueFrom: { configMapKeyRef: { name: swiftdrop-config, key: MINIO_BUCKET_PROOFS } }
          volumeMounts:
            - { name: data, mountPath: /bitnami/minio/data }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.storage.minio }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports: [{ port: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.0
          ports: [{ containerPort: 1025 }, { containerPort: 8025 }]
          readinessProbe:
            exec: { command: ["/mailpit", "readyz"] }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: web, port: 8025 }
