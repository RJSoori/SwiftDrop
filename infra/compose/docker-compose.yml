# SwiftDrop local stack. Run from this folder:  docker compose up --build
# All configuration comes from .env (see .env.example).
name: swiftdrop

# Shared by the Spring services. Each one sets SERVER_PORT, which the health check uses.
x-spring-service: &spring-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

x-spring-env: &spring-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-keys.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      PARCEL_DB_PASSWORD: ${PARCEL_DB_PASSWORD:?}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/20-swiftdrop-schemas.sh:/docker-entrypoint-initdb.d/20-swiftdrop-schemas.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio was removed from Docker Hub; pgsty/minio is the maintained community build.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: auth-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8081"
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run scripts/dev-keys.sh}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run scripts/dev-keys.sh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run scripts/dev-keys.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }

  parcel-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: parcel-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8082"
      DB_USERNAME: parcel_svc
      DB_PASSWORD: ${PARCEL_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  dispatch-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: dispatch-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8083"
      DB_USERNAME: dispatch_svc
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  merchant-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: merchant-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8084"
      DB_USERNAME: merchant_svc
      DB_PASSWORD: ${MERCHANT_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: notification-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8085"
      DB_USERNAME: notification_svc
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  gateway:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: gateway } }
    environment:
      SERVER_PORT: "8080"
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      PARCEL_SERVICE_URL: http://parcel-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      MERCHANT_SERVICE_URL: http://merchant-service:8084
      CORS_ALLOWED_ORIGINS: ${WEB_APP_URL:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      parcel-service: { condition: service_healthy }
      dispatch-service: { condition: service_healthy }
      merchant-service: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
