# SwiftDrop local stack. Run from this folder:  docker compose up --build
# All configuration comes from .env (see .env.example).
name: swiftdrop

# Shared by the Spring services. Each one sets SERVER_PORT, which the health check uses.
# 512 MB per container: the Dockerfile's MaxRAMPercentage=75 turns that into a ~384 MB heap.
x-spring-service: &spring-service
  restart: unless-stopped
  mem_limit: 512m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

# Spring's relaxed binding maps SPRING_RABBITMQ_* onto spring.rabbitmq.*, so every service that pulls in AMQP
# (directly or through the common-lib outbox) finds the broker without its own application.yml lines.
x-spring-env: &spring-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run scripts/dev-keys.sh}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run scripts/dev-keys.sh}

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-keys.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      PARCEL_DB_PASSWORD: ${PARCEL_DB_PASSWORD:?}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:?}
      MERCHANT_DB_PASSWORD: ${MERCHANT_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD:?run scripts/dev-keys.sh}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?run scripts/dev-keys.sh}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?run scripts/dev-keys.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/20-swiftdrop-schemas.sh:/docker-entrypoint-initdb.d/20-swiftdrop-schemas.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for courier proof photos. MinIO no longer publishes community images, so this is the
  # last Bitnami build (frozen, pinned). MINIO_DEFAULT_BUCKETS creates the bucket on first start.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-swiftdrop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/dev-keys.sh}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET_PROOFS:-proofs}
    volumes:
      - miniodata:/bitnami/minio/data
    # S3 API only: MinIO dropped its web console from the server in 2025. Browse with any S3 client.
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Catches every email notification-service sends. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["8025:8025"] # SMTP stays inside the compose network on 1025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- Spring services ----------
  auth-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: auth-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8081"
      DB_USERNAME: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run scripts/dev-keys.sh}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run scripts/dev-keys.sh}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run scripts/dev-keys.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }

  parcel-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: parcel-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8082"
      DB_USERNAME: parcel_svc
      DB_PASSWORD: ${PARCEL_DB_PASSWORD}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run scripts/dev-keys.sh} # recipient phone encryption (M3)
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000} # tracking link in label QR codes (M7)
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  dispatch-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: dispatch-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8083"
      AUTH_SERVICE_URL: http://auth-service:8081
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DB_USERNAME: dispatch_svc
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD}
      PARCEL_SERVICE_URL: http://parcel-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      # Proof photos (M9). Local dev uses the MinIO root login; production would use a scoped key.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-swiftdrop}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PROOFS: ${MINIO_BUCKET_PROOFS:-proofs}
    depends_on:
      auth-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  merchant-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: merchant-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8084"
      DB_USERNAME: merchant_svc
      DB_PASSWORD: ${MERCHANT_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis # idempotency keys (M6)
      PARCEL_SERVICE_URL: http://parcel-service:8082
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run scripts/dev-keys.sh} # webhook secrets at rest
      WEBHOOK_RETRY_DELAYS: ${WEBHOOK_RETRY_DELAYS:-PT5S,PT10S,PT20S,PT40S}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: notification-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8085"
      DB_USERNAME: notification_svc
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8081
      PARCEL_SERVICE_URL: http://parcel-service:8082
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@swiftdrop.test}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  realtime-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: realtime-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8086"
      DB_USERNAME: realtime_svc
      DB_PASSWORD: ${REALTIME_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis # pub/sub fan-out between replicas (M7)
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  reporting-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: reporting-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8087"
      DB_USERNAME: reporting_svc
      DB_PASSWORD: ${REPORTING_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ai-assistant-service:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: ai-assistant-service } }
    environment:
      <<: *spring-env
      SERVER_PORT: "8088"
      DB_USERNAME: ai_svc
      DB_PASSWORD: ${AI_DB_PASSWORD}
      GATEWAY_URL: http://gateway:8080 # tools call our API with the customer's own JWT (M1)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    <<: *spring-service
    build: { context: ../.., dockerfile: services/Dockerfile, args: { SERVICE: gateway } }
    environment:
      SERVER_PORT: "8080"
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-http://auth-service:8081}
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      PARCEL_SERVICE_URL: http://parcel-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      MERCHANT_SERVICE_URL: http://merchant-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      REALTIME_SERVICE_URL: http://realtime-service:8086
      REPORTING_SERVICE_URL: http://reporting-service:8087
      AI_ASSISTANT_SERVICE_URL: http://ai-assistant-service:8088
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run scripts/dev-keys.sh}
      CORS_ALLOWED_ORIGINS: ${WEB_APP_URL:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      parcel-service: { condition: service_healthy }
      dispatch-service: { condition: service_healthy }
      merchant-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      realtime-service: { condition: service_healthy }
      reporting-service: { condition: service_healthy }
      ai-assistant-service: { condition: service_healthy }

  # ---------- Frontends ----------
  web:
    build:
      context: ../../apps/web
      args: { GATEWAY_URL: http://gateway:8080 }
    restart: unless-stopped
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      gateway: { condition: service_healthy }

  # Fake online shop (M6). Its own container so the demo can `docker compose stop demo-store` to show retries.
  # Webhook URL to register for it: http://demo-store:4000/webhooks/swiftdrop
  demo-store:
    build: { context: ../../apps/demo-store }
    restart: unless-stopped
    environment:
      PORT: "4000"
      SWIFTDROP_API_URL: http://gateway:8080
      DEMO_STORE_API_KEY: ${DEMO_STORE_API_KEY:-}
      DEMO_STORE_WEBHOOK_SECRET: ${DEMO_STORE_WEBHOOK_SECRET:-}
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  miniodata:
