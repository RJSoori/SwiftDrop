server:
  port: 8083

spring:
  application:
    name: dispatch-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${DB_USERNAME:dispatch_svc}
    password: ${DB_PASSWORD:}
  flyway:
    schemas: dispatch
  servlet:
    multipart:
      max-file-size: ${COURIER_PROOF_MAX_FILE_SIZE:5MB}
      max-request-size: ${COURIER_PROOF_MAX_REQUEST_SIZE:6MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: dispatch
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://auth-service:8081}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Shared transactional outbox from common-lib (relay polls dispatch.outbox_events)
swiftdrop:
  outbox:
    enabled: true
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  courier:
    otp-ttl: ${COURIER_OTP_TTL:PT24H}
    otp-max-attempts: ${COURIER_OTP_MAX_ATTEMPTS:5}
    proof-max-file-size: ${COURIER_PROOF_MAX_FILE_SIZE:5MB}
    proof-bucket: ${COURIER_PROOF_BUCKET:proofs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
