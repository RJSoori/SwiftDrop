# Test-only values. The PII key is base64("swiftdrop-test-key-not-a-secret!"); JWT keys are left empty so an
# ephemeral keypair is generated.
# Shared secret for /internal/** (InternalTokenAuthorizationManager reads ${INTERNAL_TOKEN}).
INTERNAL_TOKEN: test-internal-token

swiftdrop:
  auth:
    pii-encryption-key: c3dpZnRkcm9wLXRlc3Qta2V5LW5vdC1hLXNlY3JldCE=
  seed:
    enabled: true
    password: Seed-pass-123
  # No broker in these tests: the relay runs once at startup, then rows stay unpublished so tests can read them.
  outbox:
    poll-interval-ms: 3600000
