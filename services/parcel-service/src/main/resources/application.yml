server:
  port: 8082

spring:
  application:
    name: parcel-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/swiftdrop}
    username: ${DB_USERNAME:parcel_svc}
    password: ${DB_PASSWORD:}
  flyway:
    schemas: parcel
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: parcel
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://auth-service:8081}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASSWORD:0e3efa25dd4d117f8d267dedd00ca128}

# Shared transactional outbox from common-lib (relay polls parcel.outbox_events)
swiftdrop:
  outbox:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
