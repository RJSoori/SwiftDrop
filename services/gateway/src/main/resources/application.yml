server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://auth-service:8081}

swiftdrop:
  routes:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    parcel: ${PARCEL_SERVICE_URL:http://localhost:8082}
    dispatch: ${DISPATCH_SERVICE_URL:http://localhost:8083}
    merchant: ${MERCHANT_SERVICE_URL:http://localhost:8084}
    # Defaults are the compose service names, so compose needs no extra lines for these.
    notification: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
    realtime: ${REALTIME_SERVICE_URL:http://realtime-service:8086}
    reporting: ${REPORTING_SERVICE_URL:http://reporting-service:8087}
    assistant: ${AI_ASSISTANT_SERVICE_URL:http://ai-assistant-service:8088}
  # Sent as X-Internal-Token when introspecting merchant API keys
  internal-token: ${INTERNAL_TOKEN:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
